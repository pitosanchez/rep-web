name: Build & Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
          # Lockfile lives under rep-web/ (monorepo); root has no package-lock.json
          cache-dependency-path: rep-web/package-lock.json

      - name: Install dependencies
        run: npm ci --prefix rep-web

      - name: Lint code
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Type check
        run: npm run type-check

  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
          cache-dependency-path: rep-web/package-lock.json

      - name: Install dependencies
        run: npm ci --prefix rep-web

      - name: Run tests
        run: npm run test --prefix rep-web -- --passWithNoTests
